workflows:
  novastream_android_internal:
    name: NovaStream Android Internal
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - novastream_build_secrets
      vars:
        PACKAGE_NAME: com.novastream.player
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feat/novastream-player
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  novastream_ios_testflight:
    name: NovaStream iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - novastream_build_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.novastream.player
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: v*
          include: true
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Tests
        script: flutter test
      - name: Build IPA
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
