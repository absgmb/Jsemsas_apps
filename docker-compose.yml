services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jsemsas
      POSTGRES_USER: jsemsas
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    depends_on: [db, redis]
    ports: ["8000:8000"]
  celery:
    build: .
    command: celery -A config worker -l INFO
    env_file: .env
    depends_on: [db, redis]
  celery-beat:
    build: .
    command: celery -A config beat -l INFO
    env_file: .env
    depends_on: [db, redis]
volumes:
  postgres_data:
