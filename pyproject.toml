[project]
name = "jsemsas"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.0,<6.0",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-filter>=24.0",
  "django-cors-headers>=4.4",
  "django-simple-history>=3.7",
  "dj-database-url>=2.2",
  "gunicorn>=23.0",
  "whitenoise>=6.7",
  "psycopg[binary]>=3.2",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "channels>=4.1",
  "channels-redis>=4.2",
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "qrcode[pil]>=7.4",
  "Pillow>=10.4",
  "reportlab>=4.2",
  "python-dotenv>=1.0",
]

[tool.vercel.scripts]
build = "python manage.py makemigrations --noinput && python manage.py migrate --noinput && python manage.py collectstatic --noinput"
